name: Build and publish to s3 bucket
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Use Node.js 12.x
        uses: actions/setup-node@v1
        with:
            node-version: 12.x
      - run: yarn install
      - run: yarn test:coverage

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: write # github release
    steps:
      - uses: actions/checkout@master
      - name: Use Node.js 12.x
        uses: actions/setup-node@v1
        with:
            node-version: 12.x
      - run: sudo apt-get update && sudo apt-get install -y zip
      - run: yarn install
      - run: yarn run semantic-release
      - run: ./script/release
      - run: ./script/publish
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # public, versioned download of the build for orbf2 (rake hesabu_manager:install)
      - name: Publish the build as a github release
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" Hesabu.zip \
            --target "$GITHUB_SHA" \
            --title "Hesabu manager build ${GITHUB_RUN_NUMBER}" \
            --notes "Build of ${GITHUB_SHA}, served by orbf2 at /setup/hesabu_manager"
        env:
          GH_TOKEN: ${{ github.token }}
